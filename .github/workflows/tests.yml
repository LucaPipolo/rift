name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    # Reads the base branch's coverage and comments how it changed on the pull request.
    permissions:
      contents: read
      actions: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: xdebug
          ini-values: phar.readonly=0, memory_limit=512M

      - uses: actions/setup-go@v7
        with:
          go-version-file: dash/go.mod
          cache-dependency-path: dash/go.sum

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # --ci runs the whole suite: TIA is for local runs only.
      - name: Run PHP tests with coverage
        run: vendor/bin/pest --ci --coverage --min=100 --coverage-clover clover.xml --coverage-html coverage-html
        env:
          XDEBUG_MODE: coverage

      # Every check runs even when an earlier one failed, so one run reports them all.
      - name: Check PHP type coverage
        if: ${{ !cancelled() }}
        run: vendor/bin/pest --type-coverage --min=100
        env:
          XDEBUG_MODE: 'off'

      - name: Run Go tests with coverage
        if: ${{ !cancelled() }}
        working-directory: dash
        run: sh scripts/coverage.sh

      # The race detector needs cgo, which the Alpine development image leaves out, so only CI runs it.
      - name: Run Go tests with the race detector
        if: ${{ !cancelled() }}
        working-directory: dash
        run: go test -race ./...
        env:
          CGO_ENABLED: '1'

      # Uploaded even when coverage drops below 100%, to show what is missing.
      - name: Upload HTML coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: |
            coverage-html
            dash/coverage.html
          if-no-files-found: ignore

      - name: Download base coverage
        if: github.event_name == 'pull_request'
        id: baseline
        uses: dawidd6/action-download-artifact@v21
        continue-on-error: true
        with:
          workflow: tests.yml
          branch: ${{ github.base_ref }}
          event: push
          name: coverage-report
          path: coverage-base

      - name: Upload coverage results
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: clover.xml
          if-no-files-found: error

      - name: Upload baseline coverage
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: clover.xml
          if-no-files-found: error

      - name: Coverage report
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        uses: lucassabreu/comment-coverage-clover@v0.17.1
        with:
          file: clover.xml
          base-file: ${{ steps.baseline.outcome == 'success' && 'coverage-base/clover.xml' || '' }}
          show-percentage-change-on-table: true
          with-branches: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
