name: Sniff

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sniff:
    name: sniff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - uses: actions/setup-go@v7
        with:
          go-version-file: dash/go.mod
          cache-dependency-path: dash/go.sum

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Larastan (PHPStan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      # The same golangci-lint as docker/go.Dockerfile, so CI and `make sniff` agree.
      - name: Run golangci-lint
        if: ${{ !cancelled() }}
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: dash
